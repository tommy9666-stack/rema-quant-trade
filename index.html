<p style="margin: 0 0 28px; font-size: 17px; color: #4B5563; max-width: 760px">Rema는 <b>직접 고른 종목을 언제 살지</b>와 <b>지금 얼마나 위험한지</b>를 텔레그램으로 알려 주는 도우미입니다. 주문은 넣지 않고, 종목을 골라 주지도 않습니다. 사고파는 결정과 주문은 본인이 합니다.</p>

<h3 style="margin: 0 0 12px; font-size: 20px">1. 돈은 세 칸으로 나눕니다</h3>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 12px; margin-bottom: 8px">
<div style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 20px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #0F6E5A">기본 40%</div><h4 style="margin: 4px 0 6px; font-size: 17px">🪜 장투</h4><p style="margin: 0; font-size: 15px; color: #374151">직접 고른 종목을 고점 대비 -10 / -20 / -30%에 닿을 때마다 1/3씩 삽니다. 1년 안에 다 쓰고, 규칙상 팔지 않습니다.</p></div>
<div style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 20px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #0F6E5A">기본 50%</div><h4 style="margin: 4px 0 6px; font-size: 17px">📈 지수 엔진</h4><p style="margin: 0; font-size: 15px; color: #374151">나스닥 2 : 코스피 1. 나스닥이 200일 평균 아래로 끝나면 그 몫만 단기채로 옮겼다가, 위로 돌아오면 다시 삽니다.</p></div>
<div style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 20px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #0F6E5A">기본 10% · 선택</div><h4 style="margin: 4px 0 6px; font-size: 17px">⚡ 단타</h4><p style="margin: 0; font-size: 15px; color: #374151">직접 하는 짧은 매매입니다. 검증상 비용을 넘는 규칙이 없어 몫을 작게 두고, 기록해서 실제 성적을 봅니다.</p></div>
</div>
<p style="margin: 0 0 32px; font-size: 14px; color: #4B5563">비율은 직접 정합니다. 봇에서 <code>/month 비율 60 30 10</code>처럼 바꿀 수 있습니다.</p>

<h3 style="margin: 0 0 12px; font-size: 20px">2. 관심종목은 장투·단타로 나뉩니다</h3>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 12px; margin-bottom: 32px"><div style="background: #FFFFFF; border: 1px solid #D9DEE5; border-top: 4px solid #0F6E5A; border-radius: 8px; padding: 18px 20px"><div style="font-weight: 700; font-size: 17px; margin-bottom: 8px">🪜 장투</div><dl style="margin: 0; display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 8px 12px; font-size: 15px"><dt style="color: #6B7280">사는 방법</dt><dd style="margin: 0">정한 구간에서 1/3씩(🔔 알림)</dd><dt style="color: #6B7280">파는 규칙</dt><dd style="margin: 0">없음 — 팔지 않음</dd><dt style="color: #6B7280">손절·목표가 알림</dt><dd style="margin: 0">오지 않음</dd><dt style="color: #6B7280">처음 들어가는 곳</dt><dd style="margin: 0">종목 분석 결과의 ➕</dd></dl></div><div style="background: #FFFFFF; border: 1px solid #D9DEE5; border-top: 4px solid #8A6416; border-radius: 8px; padding: 18px 20px"><div style="font-weight: 700; font-size: 17px; margin-bottom: 8px">⚡ 단타</div><dl style="margin: 0; display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 8px 12px; font-size: 15px"><dt style="color: #6B7280">사는 방법</dt><dd style="margin: 0">직접 판단</dd><dt style="color: #6B7280">파는 규칙</dt><dd style="margin: 0">직접 정한 손절가(<code>/stop</code>)</dd><dt style="color: #6B7280">손절·목표가 알림</dt><dd style="margin: 0">정한 가격에서 한 번</dd><dt style="color: #6B7280">처음 들어가는 곳</dt><dd style="margin: 0">스크리너 후보의 ➕ · 바꾸기 <code>/style</code></dd></dl></div></div>

<h3 style="margin: 0 0 12px; font-size: 20px">3. 첫날 다섯 단계</h3>
<ol style="margin: 0 0 32px; padding-left: 22px; font-size: 16px; color: #374151">
<li style="margin-bottom: 8px">봇에 "안녕"을 보내고 승인 메시지를 기다립니다.</li>

<li style="margin-bottom: 8px">길게 볼 종목이면 결과 아래 ➕로 관심종목(🪜 장투)에 담습니다.</li>
<li style="margin-bottom: 8px"><code>/month</code>로 이달 넣을 돈을 내 비율대로 나눠 봅니다.</li>
<li>실제로 샀으면 "매수 삼성전자 70000 10"처럼 기록합니다. 성적과 위험 점검이 여기서 시작됩니다.</li>
</ol>

<h3 style="margin: 0 0 12px; font-size: 20px">4. 알림이 오면 이렇게</h3>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 1px; background: #D9DEE5; border: 1px solid #D9DEE5; border-radius: 8px; overflow: hidden; margin-bottom: 32px">
<div style="background: #FFFFFF; padding: 18px"><b>🔔 장투 구간 도달</b><p style="margin: 4px 0 0; font-size: 15px; color: #4B5563">그 종목 몫의 1/3을 증권사 앱에서 직접 사고, ✅ 샀음을 눌러 기록합니다.</p></div>
<div style="background: #FFFFFF; padding: 18px"><b>🚦 지수 200일선 · 급락 수칙</b><p style="margin: 4px 0 0; font-size: 15px; color: #4B5563">나스닥 몫만 규칙대로 옮깁니다. 장투 종목은 그대로 두고, 대기 자금을 한꺼번에 쓰지 않습니다.</p></div>
<div style="background: #FFFFFF; padding: 18px"><b>🔻 단기 기준선 · 손절가</b><p style="margin: 4px 0 0; font-size: 15px; color: #4B5563">⚡ 단타 종목에만 옵니다. 미리 정한 대로 대응합니다.</p></div>
<div style="background: #FFFFFF; padding: 18px"><b>📰 속보 · 공시 · 🚀 급등 경고</b><p style="margin: 4px 0 0; font-size: 15px; color: #4B5563">참고 정보입니다. 뉴스를 보고 따라 사거나 겁나서 팔지 않습니다.</p></div>

<h3 style="margin: 0 0 12px; font-size: 20px">5. 더 알고 싶으면</h3>
<ul style="margin: 0 0 24px; padding-left: 22px; font-size: 16px; color: #374151">
<li style="margin-bottom: 6px"><code>/learn</code> — 검증 숫자로 배우는 짧은 강의 12개와 퀴즈</li>
<li style="margin-bottom: 6px"><code>/help</code> · <code>/guide</code> — 명령어 안내와 전체 설명서(PDF)</li>
<li><code>/inquiry</code> — 궁금한 점이나 이상한 알림 문의</li>
</ul>
<p style="margin: 0; font-size: 13px; color: #4B5563">이 봇은 투자 판단을 돕는 정보 도구이며 투자 자문이 아닙니다. 과거 결과는 미래 수익을 보장하지 않습니다.</p>

<p style="margin: 0 0 16px; font-size: 15px; color: #4B5563">봇 채팅창에서 <code>/</code>를 누르면 나오는 목록과 같습니다. 낱말로 찾아보세요. 명령어를 몰라도 그냥 말로 물어보면 됩니다.</p>
<label style="display: block; max-width: 520px; margin-bottom: 14px"><span style="display: block; font-size: 13px; color: #4B5563; margin-bottom: 6px">찾을 낱말 (예: 세금, 차트, 종이)</span>
<input id="cmd-search" type="search" value="{{cmdQuery}}" onInput="{{onCmdSearch}}" placeholder="세금, 차트, 위험 …" autocomplete="off" style="width: 100%; box-sizing: border-box; min-height: 48px; padding: 0 14px; border: 2px solid #0B1F3A; border-radius: 6px; font: inherit; font-size: 16px; background: #FFFFFF; color: #0B1F3A"></label>
<p style="margin: 0 0 10px; font-size: 13px; color: #6B7280" data-cmdcount="1">{{cmdCountLabel}}</p>
<ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 8px">
<sc-for list="{{cmdList}}" as="cm" hint-placeholder-count="6">
<li data-cmd="{{cm.key}}" hidden="{{cm.hidden}}" style="background: #F7F8FA; border: 1px solid #E5E9EE; border-radius: 6px; padding: 10px 14px; font-size: 15px"><code style="font-family: 'IBM Plex Mono', monospace; color: #0F6E5A; font-weight: 600">/{{cm.name}}</code> <span style="color: #374151">{{cm.desc}}</span></li>
</sc-for>
</ul>
<button type="button" data-cmdmore="1" onClick="{{onCmdAll}}" style="margin-top: 12px; width: 100%; max-width: 520px; min-height: 48px; border-radius: 6px; border: 2px solid #0B1F3A; background: #FFFFFF; color: #0B1F3A; font: inherit; font-weight: 700; cursor: pointer">{{cmdAllLabel}}</button>
</div>
</section>
<section style="padding: 56px 24px 72px; background: #F7F8FA; border-top: 1px solid #D9DEE5">
<div style="max-width: 1200px; margin: 0 auto">
<p style="margin: 0 0 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.12em; color: #0F6E5A">HELP</p>
<h2 style="margin: 0 0 24px; font-family: 'Noto Serif KR', serif; font-size: clamp(24px, 3vw, 32px); line-height: 1.3">막히면 이렇게</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 14px; margin-top: 0">
<div style="background: #0B1F3A; color: #FFFFFF; border-radius: 8px; padding: 26px; display: flex; gap: 18px; align-items: flex-start">
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#E3CB92" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M2 8l10-5 10 5-10 5z"></path><path d="M6 10v5c3 2 9 2 12 0v-5"></path><path d="M22 8v6"></path></svg>
<div><h3 style="margin: 0 0 6px; font-size: 19px">투자 공부 <code style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #E3CB92">/learn</code></h3><p style="margin: 0; color: #C8D2E1; font-size: 15px">봇이 실제로 검증한 숫자로 배우는 3~5분짜리 강의 12개: 분산, 200일선, 나눠 사기, 손절과 적정 수량, 단타의 비용, 백테스트 함정, 내부자 매수, 매크로·이벤트, 급락장 수칙, 세금과 계좌, 다른 도구와 함께 쓰기, 차트 패턴 8가지와 참고 타점. 강의마다 퀴즈 1문제.</p></div>
</div>
<div style="background: #0B1F3A; color: #FFFFFF; border-radius: 8px; padding: 26px; display: flex; gap: 18px; align-items: flex-start">
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#8FD3BF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 4h16v12H7l-3 3z"></path><path d="M8 9h8"></path><path d="M8 12h5"></path></svg>
<div><h3 style="margin: 0 0 6px; font-size: 19px">문의하기 <code style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #8FD3BF">/inquiry</code></h3><p style="margin: 0; color: #C8D2E1; font-size: 15px">답이 필요한 질문·오류·요청을 남기면 관리자가 텔레그램으로 답합니다. 답이 늦어지는 문의는 매주 월요일 투자위원회에서 따로 챙기고, 기능 요청은 디자인·UX팀이 안건으로 올립니다.</p></div>
</div>
<div style="background: #0B1F3A; color: #FFFFFF; border-radius: 8px; padding: 26px; display: flex; gap: 18px; align-items: flex-start">
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#7DA6FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7"></path><path d="M12 17h.01"></path></svg>
<div><h3 style="margin: 0 0 6px; font-size: 19px">상담 데스크 <code style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #7DA6FF">/ask</code></h3><p style="margin: 0; color: #C8D2E1; font-size: 15px">'PER이 뭐야?', '200일선은 왜 나스닥에만 써?'처럼 채팅으로 물으면 투자 공부 강의·용어 사전·회사 규칙을 근거로 바로 답합니다. 종목을 사라·팔라고 하지는 않습니다. 대화 중 나온 제안은 버튼 하나로, 또는 <code style="font-family: 'IBM Plex Mono', monospace; color: #7DA6FF">/idea</code>로 월요일 투자위원회 검토에 올라갑니다.</p></div>
</div>
<div style="background: #0B1F3A; color: #FFFFFF; border-radius: 8px; padding: 26px; display: flex; gap: 18px; align-items: flex-start">
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#C29BF0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-6h4v6"></path></svg>
<div><h3 style="margin: 0 0 6px; font-size: 19px">어디서든 처음 화면으로</h3><p style="margin: 0; color: #C8D2E1; font-size: 15px">명령어를 몰라도 메뉴 버튼으로 거의 모든 기능이 열립니다. 종목이 필요한 기능(종목 카드·차트·실적)은 관심종목 버튼을 누르면 되고, 결과 메시지마다 🏠 메인 메뉴 버튼이 붙습니다. 스크리너 자동 알림은 국내·미국을 따로 끌 수 있습니다.</p></div>
</div>
<div style="background: #0B1F3A; color: #FFFFFF; border-radius: 8px; padding: 26px; display: flex; gap: 18px; align-items: flex-start">
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#C9A55A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M6 3h9l4 4v14H6z"></path><path d="M15 3v4h4"></path><path d="M9 17v-3"></path><path d="M12 17v-6"></path><path d="M15 17v-4"></path></svg>
<div><h3 style="margin: 0 0 6px; font-size: 19px">결과는 리포트 한 장</h3><p style="margin: 0; color: #C8D2E1; font-size: 15px">아침 데일리 리포트, 이달의 플랜, 종목 카드, 위험 점검, 실행 장부, 급락장 수칙, 매달·매년 매매 리포트가 증권사 리포트처럼 그림 한 장으로 옵니다. 숫자는 봇 기록과 공개 시세에서 계산하고, AI 비용이 들지 않습니다.</p></div>
</div>
</div>
</div>
</section>

<section style="padding: 56px 24px 72px; background: #FFFFFF; border-top: 1px solid #D9DEE5">
<div style="max-width: 860px; margin: 0 auto">
<p style="margin: 0 0 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.12em; color: #0F6E5A">FAQ</p>
<h2 style="margin: 0 0 20px; font-family: 'Noto Serif KR', serif; font-size: clamp(24px, 3vw, 32px); line-height: 1.3">자주 묻는 질문</h2>
<details id="faq-1" style="border-top: 1px solid #D9DEE5; padding: 4px 0"><summary style="min-height: 48px; display: flex; align-items: center; cursor: pointer; font-weight: 700; font-size: 16px">무료인가요?</summary><p style="margin: 0 0 14px; font-size: 15px; color: #374151">지금은 무료입니다. 서버·AI 비용은 운영자가 내며, 바뀌면 봇과 이 페이지에서 먼저 알립니다.</p></details>
<details id="faq-2" style="border-top: 1px solid #D9DEE5; padding: 4px 0"><summary style="min-height: 48px; display: flex; align-items: center; cursor: pointer; font-weight: 700; font-size: 16px">누가 쓸 수 있나요?</summary><p style="margin: 0 0 14px; font-size: 15px; color: #374151">텔레그램에서 /start 를 보내면 관리자에게 승인 요청이 갑니다. 승인된 사람만 답을 받습니다.</p></details>
<details id="faq-3" style="border-top: 1px solid #D9DEE5; padding: 4px 0"><summary style="min-height: 48px; display: flex; align-items: center; cursor: pointer; font-weight: 700; font-size: 16px">봇이 대신 사고팔아 주나요?</summary><p style="margin: 0 0 14px; font-size: 15px; color: #374151">아니요. 봇은 알림과 기록만 합니다. 주문 기능은 만들지 않으며, 증권사 연동도 잔고 조회까지만입니다.</p></details>
<details id="faq-4" style="border-top: 1px solid #D9DEE5; padding: 4px 0"><summary style="min-height: 48px; display: flex; align-items: center; cursor: pointer; font-weight: 700; font-size: 16px">수익을 보장하나요?</summary><p style="margin: 0 0 14px; font-size: 15px; color: #374151">아니요. 과거 자료로 시험한 결과를 보여 줄 뿐이고, 미래 수익은 보장하지 않습니다. 투자 판단과 결과의 책임은 본인에게 있습니다.</p></details>
<details id="faq-5" style="border-top: 1px solid #D9DEE5; padding: 4px 0"><summary style="min-height: 48px; display: flex; align-items: center; cursor: pointer; font-weight: 700; font-size: 16px">내 정보는 어디에 저장되나요?</summary><p style="margin: 0 0 14px; font-size: 15px; color: #374151">관심종목·매매 기록은 봇 서버에만 저장되고 공개 자료에는 개수만 들어갑니다. 계좌번호·비밀번호는 받지 않습니다.</p></details>
<details id="faq-6" style="border-top: 1px solid #D9DEE5; padding: 4px 0"><summary style="min-height: 48px; display: flex; align-items: center; cursor: pointer; font-weight: 700; font-size: 16px">비율(장투·지수 엔진·단타)은 누가 정하나요?</summary><p style="margin: 0 0 14px; font-size: 15px; color: #374151">본인이 정합니다. 기본값 40·50·10은 출발점일 뿐이고 /month 비율 로 언제든 바꿉니다. 회사는 의견만 덧붙입니다.</p></details>
<details id="faq-7" style="border-top: 1px solid #D9DEE5; padding: 4px 0"><summary style="min-height: 48px; display: flex; align-items: center; cursor: pointer; font-weight: 700; font-size: 16px">실제 성적은 볼 수 있나요?</summary><p style="margin: 0 0 14px; font-size: 15px; color: #374151">봇의 /track(실전 기록)과 종이 펀드에서 봅니다. 이 페이지에는 기록이 30건 넘게 쌓이면 건수와 지수 대비 차이만 공개할 예정입니다.</p></details>
<details id="faq-8" style="border-top: 1px solid #D9DEE5; padding: 4px 0"><summary style="min-height: 48px; display: flex; align-items: center; cursor: pointer; font-weight: 700; font-size: 16px">이상한 알림이 오면?</summary><p style="margin: 0 0 14px; font-size: 15px; color: #374151">/inquiry 로 알려 주세요. 매주 투자위원회에서 원인과 고칠 방법을 검토합니다.</p></details>
</div>
</section>
</sc-if>

<sc-if value="{{isAnalysis}}" hint-placeholder-val="{{false}}">
<section style="padding: 56px 24px 80px">
<div style="max-width: 1200px; margin: 0 auto">
<p style="margin: 0 0 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.12em; color: #0F6E5A">FLAGSHIP · STOCK ANALYSIS</p>
<h2 style="margin: 0 0 12px; font-family: 'Noto Serif KR', serif; font-size: clamp(26px, 3.4vw, 36px); line-height: 1.3">종목 분석: 한 문장이면 됩니다</h2>
<p style="margin: 0 0 36px; font-size: 17px; color: #4B5563; max-width: 760px">"삼성전자 분석해줘", "TSLA 지금 사도 돼?"처럼 보내면 봇이 자료를 모아 차트와 함께 정리합니다. 더 깊이 알고 싶으면 심층 조사로 웹 기사와 공시를 근거로 다시 확인합니다.</p>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 18px">
<article style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 28px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap"><h3 style="margin: 0; font-size: 21px">기본 분석</h3><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #7A5A12">채팅으로 종목 질문</span></div>
<p style="margin: 8px 0 18px; color: #4B5563; font-size: 15px">숫자는 코드가 계산하고, AI는 그 숫자로 해설만 씁니다. AI가 가격이나 수량을 지어내지 않게 하기 위해서입니다.</p>
<h4 style="margin: 0 0 8px; font-size: 14px; color: #0F6E5A">모으는 자료</h4>
<ul style="margin: 0 0 18px; padding-left: 18px; font-size: 15px; color: #374151; display: grid; gap: 4px">
<li>일봉 차트와 이동평균·VWAP, 지수 대비 상대강도</li>
<li>변동성·최대 낙폭으로 정한 손절·목표 가격</li>
<li>PER·PBR·ROE, 애널리스트 목표가</li>
<li>다음 실적 발표일, 뉴스 감성, 최근 큰 매크로·국제정세 사건</li>
<li>시장 분위기(지수·VIX·환율)와 내 보유 평단·투자 성향</li>
</ul>
<h4 style="margin: 0 0 8px; font-size: 14px; color: #0F6E5A">받는 결과</h4>
<ol style="margin: 0; padding-left: 20px; font-size: 15px; color: #374151; display: grid; gap: 4px">
<li>가격 기준 시각과 차트 이미지</li>
<li>결론: 신규 진입 · 보유 · 관망 · 매도 중 하나</li>
<li>재무 평가, 차트·투심 해설, 손절·목표가</li>
<li>성향에 맞춘 적정 수량</li>
<li>없는 자료는 '자료 공백'으로 밝히고 확신도를 낮춤</li>
<li>판단에 가장 영향을 준 지표 2개 쉬운 설명</li>
</ol>
</article>

<article style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 28px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap"><h3 style="margin: 0; font-size: 21px">심층 조사</h3><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #7A5A12">/research 종목 질문</span></div>
<p style="margin: 8px 0 18px; color: #4B5563; font-size: 15px">AI가 웹을 직접 검색해 기사·공시·실적 자료를 읽고, 근거마다 출처 링크를 붙여 정리합니다.</p>
<dl style="margin: 0 0 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: #E5E9EE; border: 1px solid #E5E9EE; border-radius: 6px; overflow: hidden; font-size: 14px">
<div style="background: #FFFFFF; padding: 12px 16px"><dt style="color: #6B7280">검색</dt><dd style="margin: 0; font-weight: 600">한 번에 최대 6회</dd></div>
<div style="background: #FFFFFF; padding: 12px 16px"><dt style="color: #6B7280">출처</dt><dd style="margin: 0; font-weight: 600">근거마다 링크</dd></div>
<div style="background: #FFFFFF; padding: 12px 16px"><dt style="color: #6B7280">이용 한도</dt><dd style="margin: 0; font-weight: 600">1인 하루 3회</dd></div>
<div style="background: #FFFFFF; padding: 12px 16px"><dt style="color: #6B7280">이럴 때</dt><dd style="margin: 0; font-weight: 600">급등락 이유, 실적 반응</dd></div>
</dl>
<p style="margin: 0; font-size: 15px; color: #374151">예: <code style="font-family: 'IBM Plex Mono', monospace; background: #F1F3F6; padding: 2px 6px; border-radius: 4px">/research 삼성전자 이번 실적 반응</code></p>
<p style="margin: 12px 0 0; font-size: 15px; color: #374151">찾지 못한 내용은 지어내지 않고 '확인 못 함'으로 남깁니다. 웹 검색 비용이 커서 하루 횟수를 제한합니다.</p>
</article>
</div>

<h3 style="margin: 56px 0 8px; font-family: 'Noto Serif KR', serif; font-size: clamp(22px, 2.6vw, 28px)">분석 결과는 이렇게 읽습니다</h3>
<p style="margin: 0 0 18px; font-size: 15px; color: #4B5563; max-width: 760px">아래는 설명을 위한 <b>예시 그림</b>입니다(실제 종목 아님). 봇은 지금 가격이 추세의 어디쯤인지, 산다면 어디서 틀렸다고 인정할지(손절), 어디까지 기대하는지(목표)를 한 장으로 보여줍니다.</p>
<figure style="margin: 0 0 8px; background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 20px 20px 12px">
<svg viewBox="0 0 760 260" width="100%" role="img" aria-label="예시 차트: 가격이 이동평균선 위에서 오르는 중, 진입가·손절가·목표가 가로선" style="display: block">
<rect x="0" y="0" width="760" height="260" fill="#FFFFFF"></rect>
<line x1="40" y1="{{exTargetY}}" x2="720" y2="{{exTargetY}}" stroke="#0F6E5A" stroke-width="1.5" stroke-dasharray="6 5"></line>
<line x1="40" y1="{{exEntryY}}" x2="720" y2="{{exEntryY}}" stroke="#0B1F3A" stroke-width="1.5"></line>
<line x1="40" y1="{{exStopY}}" x2="720" y2="{{exStopY}}" stroke="#C2410C" stroke-width="1.5" stroke-dasharray="6 5"></line>
<polyline points="{{exMa}}" fill="none" stroke="#C9A55A" stroke-width="2.5"></polyline>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 24px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8A3B12; letter-spacing: 0.08em">검증 결과 · 매수 신호로는 안 씀</div>
<div style="margin-top: 6px; font-weight: 700">차트 신호만으로는 수익 예측 못 함</div>
<p style="margin: 8px 0 0; font-size: 15px; color: #374151">843종목 3년, 10만여 건 거래로 시험한 결과 신호가 난 날이 아무 날이나 산 것보다 낫지 않았습니다. 그래서 '강력 매수' 같은 표현을 없애고 차트 상태 표시로만 씁니다.</p>
</div>
<div style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 24px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #7A5A12; letter-spacing: 0.08em">추적 중 · 표본 모으는 중</div>
<div style="margin-top: 6px; font-weight: 700">AI 최종 판정의 실제 성적</div>
<p style="margin: 8px 0 0; font-size: 15px; color: #374151">모든 분석의 판정을 기록하고 20거래일 뒤 지수와 비교합니다. 신규 진입·관망 각 30건, 전체 100건이 쌓이면 '우위 있음/차이 없음'을 판정해 /performance 에 공개합니다.</p>
</div>
<div style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 24px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #0F6E5A; letter-spacing: 0.08em">확인됨 · 잘하는 일</div>
<div style="margin-top: 6px; font-weight: 700">위험 관리와 정보 정리</div>
<p style="margin: 8px 0 0; font-size: 15px; color: #374151">손절·목표가, 적정 수량, 실적 발표 임박 경고, 자료 공백 표시처럼 '실수를 줄이는' 쪽이 분석의 강점입니다. AI 비용은 분석 한 건에 몇십 원 수준입니다.</p>

<div style="margin-top: 28px; background: #0B1F3A; color: #FFFFFF; border-radius: 8px; padding: 26px 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 24px">

<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #C9A55A; letter-spacing: 0.1em">FAQ</div>
<div style="font-family: 'Noto Serif KR', serif; font-size: 20px; font-weight: 700; margin-top: 4px">처음 쓰던 골드만삭스식 리스크 엔진과 VWAP 신호는 없어졌나요?</div>
</div>
<p style="margin: 0; font-size: 15px; color: #C8D2E1">없어지지 않았습니다. 이동평균·VWAP으로 계산하는 차트 상태와, 변동성으로 손절·목표 폭을 조절하는 리스크 엔진은 지금도 모든 분석에 들어갑니다. 다만 검증 결과 차트 신호가 '살 때'를 맞히지는 못해서, 매수 추천이 아니라 차트 상태와 손절·목표가를 정하는 용도로만 씁니다.</p>

<h2 style="margin: 0 0 12px; font-family: 'Noto Serif KR', serif; font-size: clamp(26px, 3.4vw, 36px); line-height: 1.3">세 시간대로 읽는 차트와 참고 타점 <code style="font-family: 'IBM Plex Mono', monospace; font-size: 0.6em; color: #0F6E5A">/chart</code></h2>
<p style="margin: 0 0 24px; font-size: 17px; color: #4B5563; max-width: 820px">스크리너 후보나 직접 고른 단타 종목을 1시간봉·4시간봉·일봉으로 읽고, 어디서 사고 어디서 손절할지 참고 자리를 그려 줍니다. 스크리너 후보의 🧭 버튼이나 <code style="font-family: 'IBM Plex Mono', monospace; background: #F1F3F6; padding: 2px 6px; border-radius: 4px">/chart 삼성전자</code>로 엽니다. 이어서 MACD·Awesome Oscillator·Heikin-Ashi·Parabolic SAR·Bollinger Bands·RSI·Candlestick 7가지를 일봉·주봉·월봉에 적용한 '기법별 관점' 표가 오고, 기법 버튼을 누르면 설명과 작도 그림을 볼 수 있습니다. 장투·단타 종목 모두 됩니다.</p>

<div style="background: #F7F8FA; border: 1px solid #D9DEE5; border-radius: 8px; padding: 22px"><h3 style="margin: 0 0 6px; font-size: 17px">살 때와 팔 때를 함께</h3><p style="margin: 0; font-size: 15px; color: #374151">진입 구간과 손절(구간 아래끝에서 하루 변동폭의 절반 아래), 위쪽 매물대·직전 고점으로 1·2차 목표를 잡고 손익비를 계산합니다. 들고 있는 동안에는 Bull Trap·Bearish Divergence·Dead Cat 같은 경계 신호를 알려 줍니다(팔 때 기준은 단타로 산 경우만 — 장투는 팔지 않음).</p></div>
<div style="background: #0B1F3A; color: #FFFFFF; border-radius: 8px; padding: 22px"><h3 style="margin: 0 0 6px; font-size: 17px; color: #E3CB92">아직 '신호'가 아니라 '참고'인 이유</h3><p style="margin: 0; font-size: 15px; color: #C8D2E1">Golden Cross·RSI 같은 차트 규칙은 10년 검증에서 거래 비용을 넘지 못했습니다. 그래서 타점마다 그 뒤 10거래일 성적을 자동으로 기록하고(<code style="font-family: 'IBM Plex Mono', monospace; color: #E3CB92">/chart 성적</code>), 판정이 50건 쌓이면 투자위원회가 실제 판단에 쓸지 정합니다.</p></div>

<section style="padding: 80px 24px; background: #F7F8FA; border-bottom: 1px solid #D9DEE5">

<p style="margin: 0 0 24px; font-size: 13px; color: #6B7280">움직이는 화살표와 봉투는 지금 오가는 업무입니다. 말풍선은 하는 일, 물음표는 다음 일을 기다리며 생각 중, Zz는 퇴근 시간입니다. 시간에 맞춰 실제 예약 작업 일정표대로 움직입니다.</p>

<p style="margin: 24px 0 0; font-size: 13px; color: #6B7280">이 화면은 실제 업무 일정표를 그대로 옮겨 시간에 맞춰 재현한 것입니다. 실시간 상태는 아니며, 실제 상태는 봇의 /status 에서 확인합니다.</p>
</div>
</section>
</sc-if>

<sc-if value="{{isStrategy}}" hint-placeholder-val="{{false}}">
<section style="padding: 56px 24px 80px">
<div style="max-width: 1200px; margin: 0 auto">
<p style="margin: 0 0 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.12em; color: #0F6E5A">INVESTMENT POLICY</p>
<h2 style="margin: 0 0 12px; font-family: 'Noto Serif KR', serif; font-size: clamp(26px, 3.4vw, 36px); line-height: 1.3">세 갈래로 나눠 굴립니다 — 비율은 내가 정합니다</h2>
<p style="margin: 0 0 12px; font-size: 17px; color: #4B5563; max-width: 780px">장투 · 지수 엔진 · 단타의 비율은 사람마다 다릅니다. 기본은 <b>40 · 50 · 10</b>이고(2026-11-08부터, 가장 큰 몫이 가장 크게 흔들리는 개별 종목이던 구조를 줄임), 텔레그램에서 <code style="font-family: 'IBM Plex Mono', monospace; background: #F1F3F6; padding: 2px 6px; border-radius: 4px">/month 비율 70 30 0</code>처럼 보내면 그 비율대로 월급날 '이달의 플랜'이 나옵니다. 바꿔도 이미 산 것은 팔지 않고, 다음 월급날부터 새 돈으로 맞춰 갑니다.</p>
<p style="margin: 0 0 24px; font-size: 14px; color: #6B7280">합 100 · 5% 단위 · 단타는 20%까지(비용을 넘는 단타 규칙이 검증되지 않아 상한을 둡니다). 아래 버튼으로 예시를 눌러 보세요.</p>
<div role="group" aria-label="비율 예시 고르기" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px">
<sc-for list="{{mixPresets}}" as="mp" hint-placeholder-count="4">
<button type="button" onClick="{{mp.pick}}" aria-pressed="{{mp.pressed}}" style="{{mp.style}}">{{mp.label}}</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 24px; align-items: center">
<div style="display: flex; gap: 28px; align-items: center; flex-wrap: wrap">
<div role="img" aria-label="{{mixAria}}" style="{{mixDonut}}"><div style="width: 118px; height: 118px; border-radius: 50%; background: #F7F8FA; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 12px; color: #6B7280">매달 200만원</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; white-space: nowrap">{{mixTitle}}</span></div></div>
<ul style="list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; min-width: 220px">
<sc-for list="{{mixRows}}" as="mr" hint-placeholder-count="4">
<li style="display: flex; align-items: center; gap: 10px; font-size: 15px"><span style="{{mr.dot}}"></span><span style="flex: 1">{{mr.label}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600">{{mr.man}}만</span></li>
</sc-for>
</ul>
</div>
<div style="background: #0B1F3A; color: #FFFFFF; border-radius: 8px; padding: 22px 24px">
<div style="font-size: 13px; color: #AEBBD0">텔레그램에 이렇게 보내면 됩니다</div>
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; margin: 6px 0 10px; color: #E3CB92">{{mixCommand}}</div>
<div style="font-size: 14px; color: #C8D2E1">{{mixNote}}</div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 1px; background: #D9DEE5; border: 1px solid #D9DEE5; border-radius: 8px; overflow: hidden; margin-top: 28px">
<div style="background: #FFFFFF; padding: 26px"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0B1F3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"></path><path d="M6 16l4-5 3 3 5-7"></path><path d="M15 7h3v3"></path></svg><h3 style="margin: 8px 0 8px; font-size: 18px">장투 (기본 40%)</h3><p style="margin: 0; color: #374151; font-size: 15px">재무가 튼튼한 관심종목 10~15개를 고점 대비 -10% · -20% · -30% 세 구간에 나눠 삽니다. 한 종목은 이 몫의 10%를 넘지 않고, 1년이 지나도 못 산 몫은 기한 날 삽니다.</p></div>
<div style="background: #FFFFFF; padding: 26px"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0F6E5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17c3-6 6-8 9-6s5 0 9-6"></path><path d="M3 20h18" stroke-dasharray="2 3"></path></svg><h3 style="margin: 8px 0 8px; font-size: 18px">지수 엔진 (기본 50%)</h3><p style="margin: 0; color: #374151; font-size: 15px">이 몫의 2/3는 나스닥 — 200일 이동평균선 아래로 마감하면 현금으로 비키고 위로 올라오면 다시 삽니다. 1/3은 코스피를 그냥 보유합니다. 종목을 고를 필요가 없는 몫입니다.</p></div>
<div style="background: #FFFFFF; padding: 26px"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#8A6416" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg><h3 style="margin: 8px 0 8px; font-size: 18px">단타 (선택, 0~20%)</h3><p style="margin: 0; color: #374151; font-size: 15px">비용을 넘는 단타 규칙은 검증에서 찾지 못했습니다. 그래서 봇은 고르지 않고, 직접 하시는 분의 기록(#단타)만 모아 비용 뒤 성적을 보여줍니다. 안 하시려면 0으로 두세요.</p></div>
</div>

<h2 style="margin: 72px 0 12px; font-family: 'Noto Serif KR', serif; font-size: clamp(24px, 3vw, 32px); line-height: 1.3">검증 결과를 그림으로</h2>
<p style="margin: 0 0 28px; font-size: 17px; color: #4B5563; max-width: 760px">봇이 쓰는 규칙은 모두 과거 자료로 먼저 시험했습니다. 대표적인 세 가지를 같은 기간 · 같은 잣대로 비교했습니다. 과거 결과는 미래 수익을 보장하지 않습니다.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 18px">
<figure style="margin: 0; background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 24px">
<figcaption style="font-weight: 700; font-size: 16px">지수 엔진 vs 그냥 보유 (2017-02~2026-09)</figcaption>
<div style="font-size: 13px; color: #6B7280; margin: 4px 0 18px">연 수익률은 비슷하게, 최대 낙폭은 훨씬 작게 — 그림은 예전 반반 구성으로 계산(지금은 나스닥 2 : 코스피 1)</div>
<sc-for list="{{chartEngine}}" as="ce" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 10px; align-items: center; margin-bottom: 14px">
<div style="font-size: 14px; font-weight: 600">{{ce.name}}</div>
<div>
<div style="display: flex; align-items: center; gap: 8px"><div style="{{ce.cagrBar}}"></div><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #0F6E5A; white-space: nowrap">연 {{ce.cagr}}</span></div>
<div style="display: flex; align-items: center; gap: 8px; margin-top: 4px"><div style="{{ce.mddBar}}"></div><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #9A3412; white-space: nowrap">낙폭 {{ce.mdd}}</span></div>
</div>
</div>
</sc-for>
<div style="display: flex; gap: 16px; font-size: 12px; color: #6B7280"><span><span style="display: inline-block; width: 10px; height: 10px; background: #0F6E5A; margin-right: 4px"></span>연 수익률</span><span><span style="display: inline-block; width: 10px; height: 10px; background: #E07A5F; margin-right: 4px"></span>최대 낙폭(짧을수록 좋음)</span></div>
</figure>
<figure style="margin: 0; background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 24px">
<figcaption style="font-weight: 700; font-size: 16px">임원이 자기 회사 주식을 살 때 (2017~2026, 5만 6천여 건)</figcaption>
<div style="font-size: 13px; color: #6B7280; margin: 4px 0 18px">공시 다음 날 산 뒤 60거래일, 변동성이 비슷한 종목 대비 초과 수익</div>
<svg viewBox="0 0 320 170" width="100%" role="img" aria-label="대표·등기임원 장내 매수 뒤 +2.49%, 장내 매도 뒤 -1.78%" style="max-width: 420px; display: block">
<line x1="20" y1="90" x2="310" y2="90" stroke="#9AA4B2" stroke-width="1"></line>
<rect x="60" y="{{insBuyY}}" width="70" height="{{insBuyH}}" fill="#0F6E5A"></rect>
<rect x="190" y="90" width="70" height="{{insSellH}}" fill="#E07A5F"></rect>
<text x="95" y="{{insBuyLabelY}}" text-anchor="middle" font-size="14" font-weight="700" fill="#0F6E5A">+2.49% (t 5.9)</text>
<text x="225" y="{{insSellLabelY}}" text-anchor="middle" font-size="14" font-weight="700" fill="#9A3412">-1.78% (t -2.9)</text>
<text x="95" y="108" text-anchor="middle" font-size="13" fill="#374151">장내 매수</text>
<text x="225" y="80" text-anchor="middle" font-size="13" fill="#374151">장내 매도</text>
</svg>
<div style="font-size: 13px; color: #4B5563">지금은 '종이 펀드 C'로 실제 성적을 쌓는 중이고, 끝난 기록 30건 전에는 판단하지 않습니다.</div>
</figure>
<figure style="margin: 0; background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 24px">
<figcaption style="font-weight: 700; font-size: 16px">한 번에 살까, 나눠 살까 (1년 안에 다 사는 조건)</figcaption>
<div style="font-size: 13px; color: #6B7280; margin: 4px 0 18px">매달 똑같이 사기(적립식) 대비 1년 뒤 주식 수 차이</div>
<sc-for list="{{chartDip}}" as="cd" hint-placeholder-count="3">
<div style="margin-bottom: 14px">
<div style="font-size: 14px; margin-bottom: 4px">{{cd.name}}</div>
<div style="display: flex; align-items: center; gap: 8px"><div style="{{cd.bar}}"></div><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; white-space: nowrap">{{cd.val}}</span></div>
</div>
</sc-for>
<div style="font-size: 13px; color: #4B5563">차이는 1~2%로 작습니다. 그래서 장투 몫은 '고점 대비 -10/-20/-30%마다 1/3, 1년 안에 다 쓰기'로 단순하게 정했습니다.</div>
</figure>
</div>

<h2 style="margin: 72px 0 12px; font-family: 'Noto Serif KR', serif; font-size: clamp(24px, 3vw, 32px); line-height: 1.3">검증 성적표</h2>
<p style="margin: 0 0 20px; font-size: 17px; color: #4B5563; max-width: 760px">봇이 시험한 방식을 네 칸으로 나눴습니다. 좋게 나온 것만 고르지 않도록 손해였던 것과 접은 것도 함께 적습니다.</p>
<div style="background: #0B1F3A; color: #FFFFFF; border-radius: 8px; padding: 22px 26px; margin-bottom: 14px"><p style="margin: 0; font-size: 16px; color: #E8EDF4">비용을 빼고도 지수 그냥 보유를 <b style="color: #E3CB92">통계적으로 확실히</b> 이긴 종목 고르기 규칙은 아직 없습니다. 그래서 스크리너 후보와 내부자 신호는 '참고'로만 보내고, 실제 돈을 쓰기 전에 종이 펀드로 기록합니다.</p></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 24px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #0F6E5A">① 쓰는 중</div><h3 style="margin: 6px 0 12px; font-size: 18px">지금 쓰는 것과 그 이유</h3><ul style="margin: 0; padding-left: 18px; font-size: 15px; color: #374151"><li style="margin: 0 0 10px"><b>나스닥 200일선</b> — 2022년 하락(-33% → -7%)처럼 긴 하락장에서 낙폭을 줄이는 장치입니다. 수익을 더 내는 장치는 아니라서 지수 엔진의 나스닥 몫에만 씁니다.</li><li style="margin: 0 0 10px"><b>장투 나눠 사기</b>(고점 대비 -10/-20/-30%마다 1/3, 1년 안에 다 쓰기) — 3년 성적은 한 번에 사기와 비슷했습니다(미국 +39% vs +41%). 더 벌어서가 아니라 단순하고 지키기 쉬워서 골랐습니다.</li></ul></div>
<div style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 24px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #8A3B12">② 손해</div><h3 style="margin: 6px 0 12px; font-size: 18px">검증상 손해였던 것</h3><ul style="margin: 0; padding-left: 18px; font-size: 15px; color: #374151"><li style="margin: 0 0 10px"><b>큰 공급계약 공시 다음 날 시가에 사서 5일 안에 정리</b> — 건당 -1.4%, 11년 중 플러스인 해가 없었습니다.</li><li style="margin: 0 0 10px"><b>당일·3일 단타 규칙</b> — 비용(왕복 0.35%) 뒤 모두 손해. 국내 수익은 대부분 밤사이에 났습니다(장중만 보면 연 -8%).</li><li style="margin: 0 0 10px"><b>차트 매수 신호</b>(Golden Cross·RSI·눌림목) — 비슷한 종목을 아무 날이나 산 것과 차이가 없었습니다.</li></ul></div>
<div style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 24px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #7A5A12">③ 참고</div><h3 style="margin: 6px 0 12px; font-size: 18px">신호는 있지만 '사는 신호'는 아닌 것</h3><ul style="margin: 0; padding-left: 18px; font-size: 15px; color: #374151"><li style="margin: 0 0 10px"><b>대표·등기임원 장내 매수</b> — 비슷한 종목보다 60일 +2.49%(t 5.9, 내부자 매수 전체는 +1.83%). 다만 신호마다 따라 사는 포트폴리오는 코스피보다 확실히 낫지 않아 종이 펀드 C로 기록 중입니다.</li><li style="margin: 0 0 10px"><b>내부자 장내 매도</b> — 60일 -1.78%(t -2.9)로 통과 기준에는 못 미칩니다. 사기 전에 이유를 확인하라는 표시로만 씁니다.</li><li style="margin: 0 0 10px"><b>스크리너 아침 후보</b> — 순위 방식이 아직 확정되지 않아 종이 펀드 A·D로 기록 중입니다.</li></ul></div>
<div style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 24px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #4B5563">④ 접음</div><h3 style="margin: 6px 0 12px; font-size: 18px">다시 시험하지 않을 13갈래</h3><ul style="margin: 0; padding-left: 18px; font-size: 15px; color: #374151"><li style="margin: 0 0 10px">차트 신호로 매일 사고팔기, 당일·3일 단타, 장투 매수 미루기, 코스피 타이밍(200일선 포함), 국내 집중·소형 저평가 바구니, 자사주 공시 뒤 사기, 레버리지(나스닥·코스피 2배), 미국 지수 엔진 대체안, 공개 이상 현상 54개, 미국 종목 매수 타이밍, 스크리너 순위 변형, 내부자 매수 + F-점수, 국내 머신러닝 종목 고르기. 새 종류의 자료와 결재가 있어야 다시 엽니다.</li></ul></div>
</div>
<p style="margin: 14px 0 0; font-size: 13px; color: #4B5563">검증 방식: 상장폐지 종목까지 포함 · 그날 알 수 있던 정보만 사용 · 거래 비용 포함 · 시험한 횟수만큼 통과 기준을 높임. 과거 결과는 미래 수익을 보장하지 않습니다. 투자 판단과 주문은 본인이 직접 합니다.</p>

<h2 style="margin: 72px 0 12px; font-family: 'Noto Serif KR', serif; font-size: clamp(24px, 3vw, 32px); line-height: 1.3">투자위원회: 통과한 기법만 매매 규칙으로</h2>
<p style="margin: 0 0 28px; font-size: 17px; color: #4B5563; max-width: 720px">시험 조건은 결과를 보기 전에 고정하고, 시험한 횟수만큼 통과 기준을 높입니다. 매주 월요일 위원회에서 반론 담당이 따로 검토하고, 디자인·UX팀은 이용 통계와 사용자 의견으로 쓰기 편한 봇을 위한 개선안을 올립니다.</p>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 10px">
<li style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 6px; padding: 18px"><div style="font-family: 'IBM Plex Mono', monospace; color: #7A5A12">STEP 1</div><div style="font-weight: 600">가설 등록</div></li>
<li style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 6px; padding: 18px"><div style="font-family: 'IBM Plex Mono', monospace; color: #7A5A12">STEP 2</div><div style="font-weight: 600">목표 분류</div></li>
<li style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 6px; padding: 18px"><div style="font-family: 'IBM Plex Mono', monospace; color: #7A5A12">STEP 3</div><div style="font-weight: 600">같은 기준선과 시험</div></li>
<li style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 6px; padding: 18px"><div style="font-family: 'IBM Plex Mono', monospace; color: #7A5A12">STEP 4</div><div style="font-weight: 600">판정</div></li>
<li style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 6px; padding: 18px"><div style="font-family: 'IBM Plex Mono', monospace; color: #7A5A12">STEP 5</div><div style="font-weight: 600">종이 매매 6개월</div></li>
<li style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 6px; padding: 18px"><div style="font-family: 'IBM Plex Mono', monospace; color: #7A5A12">STEP 6</div><div style="font-weight: 600">승격 또는 폐기</div></li>
</ol>
<h2 style="margin: 72px 0 12px; font-family: 'Noto Serif KR', serif; font-size: clamp(24px, 3vw, 32px); line-height: 1.3">실제 돈 전에, 종이 펀드로 먼저</h2>
<p style="margin: 0 0 24px; font-size: 17px; color: #4B5563; max-width: 760px">검증을 통과했거나 지켜볼 만한 방식은 실제 돈 없이 규칙대로 사고판 기록부터 쌓습니다. 규칙은 시작 전에 고정하고, 정한 건수가 쌓이기 전에는 좋다 나쁘다 판단하지 않습니다. 이 페이지에는 기록이 30건 넘게 쌓이면 건수와 지수 대비 차이만 공개합니다.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 22px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #0F6E5A">A · /rotation</div><h3 style="margin: 6px 0 6px; font-size: 17px">추세 교체</h3><p style="margin: 0; font-size: 15px; color: #374151">추세 템플릿 + 상대강도 상위 최대 8종목을 매주 토요일 회차로 담고 20거래일 보유. 같은 종목군 동일가중과 비교.</p></div>
<div style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 22px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #0F6E5A">B</div><h3 style="margin: 6px 0 6px; font-size: 17px">미국 모멘텀</h3><p style="margin: 0; font-size: 15px; color: #374151">미국 대형주 중 최근 상승이 강한 상위 10% 바구니를 월말마다 채점합니다.</p></div>
<div style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 22px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #0F6E5A">C · /paperc</div><h3 style="margin: 6px 0 6px; font-size: 17px">내부자 매수 따라 사기</h3><p style="margin: 0; font-size: 15px; color: #374151">대표·등기임원 장내 매수 공시 다음 날 종가에 사서 60거래일 보유. 끝난 기록 30건 전에는 판단하지 않습니다.</p></div>
<div style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 22px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #0F6E5A">D · /paperd <span style="margin-left: 6px; background: #FF5D8F; color: #FFFFFF; padding: 1px 5px; border-radius: 3px; font-size: 11px">NEW</span></div><h3 style="margin: 6px 0 6px; font-size: 17px">스크리너 아침 후보 따라 사기</h3><p style="margin: 0; font-size: 15px; color: #374151">매일 아침 알림으로 받는 스크리너 후보를 그대로 따라 그날 종가에 사서 20거래일 보유(비용 왕복 국내 0.35%·미국 0.2%). 시장별 끝난 60건과 20주가 쌓이기 전에는 판단하지 않습니다. 2026-11-06 시작이라 아직 성적은 없습니다.</p></div>
</div>
</div>
</section>
</sc-if>

<div style="padding: 12px 24px; border-top: 1px solid #E5E9EE"><dt style="color: #6B7280">표본</dt><dd style="margin: 0; font-weight: 600; font-family: 'IBM Plex Mono', monospace">56,489건</dd></div>

<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #C9A55A; letter-spacing: 0.12em">STRATEGY REPORT · 접음</div>

<div style="font-size: 14px; color: #AEBBD0; margin-top: 2px">지수가 200일 평균 아래면 현금으로 비키기</div>

<div style="padding: 12px 24px; border-top: 1px solid #E5E9EE"><dt style="color: #6B7280">비교 대상</dt><dd style="margin: 0; font-weight: 600">코스피 그냥 보유</dd></div>

<sc-if value="{{isSafety}}" hint-placeholder-val="{{false}}">
<section style="padding: 56px 24px 80px">

<p style="margin: 0 0 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.12em; color: #0F6E5A">RISK &amp; COMPLIANCE</p>

      mixCommand: '/month 비율 ' + L + ' ' + E + ' ' + S, mixNote: notes[cur[0]],
      chartEngine: chartEngine, insBuyH: insBuyH, insBuyY: (90 - insBuyH).toFixed(0), insSellH: insSellH,
      insBuyLabelY: (90 - insBuyH - 8).toFixed(0), insSellLabelY: (90 + Number(insSellH) + 18).toFixed(0),
      chartDip: chartDip, dayMarks: dayMarks, team: team,
      exPrice: px.map((v, i) => X(i) + ',' + Y(v)).join(' '), exMa: ma.map((v, i) => X(i) + ',' + Y(v)).join(' '),
      exLastX: X(n - 1), exLastY: Y(entry), exEntryY: Y(entry), exStopY: Y(stop), exTargetY: Y(target),
      exEntryLabelY: (Number(Y(entry)) + 4).toFixed(1), exStopLabelY: (Number(Y(stop)) + 4).toFixed(1), exTargetLabelY: (Number(Y(target)) + 4).toFixed(1)
    };
  }
  renderVals() {
    const tab = this.state.tab || this.props.startTab || 'overview';
    const nowMs = this.state.now;
    const nowMin = Math.floor(nowMs / 60000);
    if (nowMin !== this._cacheMin) { this._sched = this.compute(nowMin); this._cacheMin = nowMin; }
    const sched = this._sched;
    const kst = this.fields(nowMs + 9 * 3600000);
    const pad = (n) => String(n).padStart(2, '0');
    const tabDefs = [['overview', '개요'], ['start', '처음이라면'], ['analysis', '종목 분석'], ['work', '일하는 모습'], ['strategy', '운용 원칙 · 검증'], ['research', '리서치 자료실'], ['safety', '안전장치']];
    const tabs = tabDefs.map((t) => {
      const on = t[0] === tab;
      return { label: t[1], pressed: on ? 'true' : 'false', pick: () => this.setState({ tab: t[0] }),
        style: 'min-height: 48px; padding: 0 clamp(10px, 2.4vw, 18px); border: 0; border-bottom: 3px solid ' + (on ? '#C9A55A' : 'transparent') + '; background: transparent; color: ' + (on ? '#FFFFFF' : '#AEBBD0') + '; font: inherit; font-size: 15px; font-weight: ' + (on ? '700' : '500') + '; cursor: pointer; white-space: nowrap; flex: none' };
    });
    const spec = this.spec();
    const deptNames = ['전체'].concat(spec.map((a) => a.dept).filter((d, i, arr) => arr.indexOf(d) === i));
    const depts = deptNames.map((d) => {
      const on = !this.state.focus && d === this.state.dept;
      return { label: d, pressed: on ? 'true' : 'false', pick: () => this.setState({ dept: d, focus: null }),
        style: 'min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid ' + (on ? '#0B1F3A' : '#C8CFD9') + '; background: ' + (on ? '#0B1F3A' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#0B1F3A') + '; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer' };
    });
    let working = 0, always = 0, soonest = null;
    const agents = spec.map((a) => {
      const base = { name: a.name, initials: a.initials, dept: a.dept, role: a.role,
        avatarStyle: 'width: 44px; height: 44px; border-radius: 50%; background: ' + a.color + '; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; flex: none' };
      if (a.always) {
        always++;
        return Object.assign(base, { isWorking: false, isIdle: false, isAlways: true, task: a.alwaysText, statusLabel: '상시',
          pillStyle: 'display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #F6EEDC; color: #6B4E0E',
          dotClass: '', dotStyle: 'width: 8px; height: 8px; border-radius: 50%; background: #B8892E',
          cardStyle: 'background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 18px', show: this.showAgent(a) });
      }
      const s = sched[a.id];
      if (s.next && (!soonest || s.next.at < soonest.at)) soonest = { at: s.next.at, who: a.name, job: s.next.job.name };
      if (s.active) {
        working++;
        const j = s.active.job;
        const elapsed = (nowMs / 60000) - s.active.start;
        const pct = Math.max(4, Math.min(100, (elapsed / j.dur) * 100));
        const ti = Math.floor(nowMs / 3500) % j.tasks.length;
        return Object.assign(base, { isWorking: true, isIdle: false, isAlways: false, jobName: j.name, task: j.tasks[ti],
          statusLabel: '작업 중', barStyle: 'height: 100%; width: ' + pct.toFixed(1) + '%; background: #0F6E5A; border-radius: 3px; transition: width 1s linear',
          pillStyle: 'display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #DDF0EA; color: #0A4F40',
          dotClass: 'tq-live', dotStyle: 'width: 8px; height: 8px; border-radius: 50%; background: #0F6E5A',
          cardStyle: 'background: #FFFFFF; border: 1px solid #0F6E5A; border-radius: 8px; padding: 18px; box-shadow: 0 2px 10px rgba(11,31,58,.08)', show: this.showAgent(a) });
      }
      return Object.assign(base, { isWorking: false, isIdle: true, isAlways: false,
        next: s.next ? this.rel(s.next.at - nowMin, s.next.at) + ' · ' + s.next.job.name : '예정 없음',
        last: s.last ? this.hm(s.last.at) + ' · ' + s.last.job.done : '기록 없음',
        statusLabel: '대기', pillStyle: 'display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #EEF1F4; color: #4B5563',
        dotClass: '', dotStyle: 'width: 8px; height: 8px; border-radius: 50%; background: #9AA4B2',
        cardStyle: 'background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 18px', show: this.showAgent(a) });
    });
    const feed = [];
    spec.forEach((a) => {
      if (a.always) return;
      const s = sched[a.id];
      if (s.last) feed.push({ at: s.last.at, time: this.hm(s.last.at), who: a.name + ' · ' + a.role, what: s.last.job.done });
    });
    feed.sort((x, y) => y.at - x.at);
    const of = this.office(spec, sched, nowMs, kst);
    const ex = this.extras(spec, kst);
    const vw = this.state.vw || 1280;
    const narrowOffice = vw < 1100;
    const fit = this.state.officeFit === null ? narrowOffice : this.state.officeFit;
    const officeZoom = (narrowOffice && fit) ? Math.max(0.3, Math.min(1, (vw - 56) / 1048)) : 1;
    const narrow = vw < 760;
    const shareUrl = (typeof location !== 'undefined' ? String(location.href).split('#')[0] : '');
    const cmdQ = this._cmdQ || '';
    const cmdAll = this.commands();
    const cmdList = cmdAll.map((c, i) => ({ name: c[0], desc: c[1], key: (c[0] + ' ' + c[1]).toLowerCase(),
      hidden: (cmdQ ? (c[0] + ' ' + c[1]).toLowerCase().indexOf(cmdQ) < 0 : (!this._cmdAll && i >= 8)) ? 'hidden' : false }));
    const cmdShown = cmdList.filter((c) => !c.hidden).length;
    return Object.assign(ex, {
      cmdList: cmdList, cmdQuery: cmdQ,
      cmdCountLabel: cmdQ ? cmdShown + '개 찾음 (전체 ' + cmdAll.length + '개)' : '전체 ' + cmdAll.length + '개' + (this._cmdAll ? '' : ' 중 8개'),
      onCmdSearch: (e) => {
        const q = String(e.target.value || '').trim().toLowerCase();
        this._cmdQ = q;
        const box = e.target.closest('[data-cmdbox]');
        if (!box) return;
        this._cmdFilter(box);
      },
      onCmdAll: (e) => { this._cmdAll = !this._cmdAll; const box = e.target.closest('[data-cmdbox]'); if (box) this._cmdFilter(box); },
      cmdAllLabel: this._cmdAll ? '접기' : '명령어 ' + cmdAll.length + '개 모두 보기',
      siteUpdated: '2026-11-11',
      isNarrow: narrow,
      teamMore: narrow && ex.team.length > 8, allTeam: this.state.allTeam ? 'true' : 'false',
      teamShown: (narrow && !this.state.allTeam) ? ex.team.slice(0, 8) : ex.team,
      teamToggleLabel: this.state.allTeam ? '접기' : '직원 ' + ex.team.length + '명 모두 보기',
      toggleTeam: () => this.setState({ allTeam: !this.state.allTeam }),
      shareLabel: (Date.now() - (this.state.copied || 0) < 2500) ? '링크 복사됨 ✓' : '공유',
      onShare: () => {
        const data = { title: 'Rema Quant Trade', text: '검증된 규칙만 남기는 텔레그램 퀀트 운용 비서', url: shareUrl };
        if (typeof navigator !== 'undefined' && navigator.share) { navigator.share(data).catch(() => {}); return; }
        if (typeof navigator !== 'undefined' && navigator.clipboard) navigator.clipboard.writeText(shareUrl).then(() => this.setState({ copied: Date.now() })).catch(() => {});
      },
      goTop: () => { try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { window.scrollTo(0, 0); } },
      isOffice: true,
      offAgents: of.offAgents, offZones: of.offZones, offFlows: of.offFlows, offMoving: of.offMoving, offWindows: of.offWindows,
      officeNight: of.officeNight, officeLabel: of.officeLabel, internStyle: of.internStyle,
      officeStyle: of.officeStyle + (officeZoom < 1 ? '; zoom: ' + officeZoom.toFixed(3) : ''),
      officeNarrow: narrowOffice, officeZoomPressed: officeZoom < 1 ? 'false' : 'true',
      officeFitLabel: officeZoom < 1 ? '🔍 크게 보기' : '↔ 화면에 맞추기',
      officeFitHint: officeZoom < 1 ? '사무실 전체를 한눈에 — 크게 보면 옆으로 밀어서 봅니다' : '← 옆으로 밀어서 사무실을 둘러보세요 →',
      toggleOfficeFit: () => this.setState({ officeFit: officeZoom < 1 ? false : true }),
      tabs: tabs,
      isOverview: tab === 'overview', isStart: tab === 'start', isAnalysis: tab === 'analysis', isWork: tab === 'work', isStrategy: tab === 'strategy', isResearch: tab === 'research', isSafety: tab === 'safety',
      goWork: () => this.setState({ tab: 'work' }),
      goStart: () => this.setState({ tab: 'start' }),
      clock: pad(kst.h) + ':' + pad(kst.m) + ':' + pad(kst.s),
      dateLabel: kst.y + '년 ' + (kst.mo + 1) + '월 ' + kst.day + '일 ' + '일월화수목금토'[kst.dow] + '요일',
      depts: depts,
      agents: agents.filter((a) => a.show),
      agentCount: spec.length,
      workingCount: working,
      alwaysCount: always,
      nextUp: soonest ? this.rel(soonest.at - nowMin, soonest.at) + ' · ' + soonest.who + ' — ' + soonest.job : '-',
      feed: feed.slice(0, 9)
    });
  }
}

(function () {
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var ONE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  function get(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope[parts[0]];
    for (var i = 1; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(str, scope) {
    var m = str.match(ONE);
    if (m) return get(scope, m[1]);
    return str.replace(HOLE, function (_, p) { var v = get(scope, p); return v == null ? '' : String(v); });
  }
  function draw(node, scope, out) {
    if (node.nodeType === 3) { var t = interp(node.nodeValue, scope); out.appendChild(document.createTextNode(t == null ? '' : String(t))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-for') {
      var list = interp(node.getAttribute('list'), scope) || [], as = node.getAttribute('as');
      list.forEach(function (item, i) {
        var s = Object.create(scope); s[as] = item; s.$index = i;
        node.childNodes.forEach(function (c) { draw(c, s, out); });
      });
      return;
    }
    if (tag === 'sc-if') { if (interp(node.getAttribute('value'), scope)) node.childNodes.forEach(function (c) { draw(c, scope, out); }); return; }
    var el = document.createElementNS(node.namespaceURI, tag);
    for (var k = 0; k < node.attributes.length; k++) {
      var a = node.attributes[k];
      if (a.name.indexOf('hint-') === 0) continue;
      var v = interp(a.value, scope);
      if (a.name.indexOf('on') === 0 && typeof v === 'function') { el.addEventListener(a.name.slice(2), v); continue; }
      if (v === undefined || v === null || v === false) continue;
      el.setAttribute(a.name, v);
    }
    node.childNodes.forEach(function (c) { draw(c, scope, el); });
    out.appendChild(el);
  }
  var root = document.getElementById('app');
  var tpl = document.getElementById('tpl').content;
  var comp = new Component({});
  var hash = (location.hash || '').replace('#', '');
  if (['overview', 'start', 'analysis', 'work', 'strategy', 'research', 'safety'].indexOf(hash) >= 0) comp.state.tab = hash;
  var last = null, lastTab = comp.state.tab;
  window.__app = {
    update: function () {
      var vals = comp.renderVals();
      var tab = comp.state.tab || 'overview';
      var now = comp.state.now;
      var sig = JSON.stringify([tab, comp.state.dept, comp.state.focus, comp.state.mix, comp.state.officeFit, comp.state.allTeam, comp.state.vw, comp.state.copied, Math.floor(now / 60000), tab === 'work' ? Math.floor(now / 3500) : 0]);
      if (sig !== last) {
        last = sig;
        // 다시 그려도 입력 중인 칸·펼친 질문이 그대로 있게
        var act = document.activeElement, actId = act && act.id, selS = null, selE = null;
        try { selS = act.selectionStart; selE = act.selectionEnd; } catch (e) {}
        var openIds = Array.prototype.map.call(root.querySelectorAll('details[open][id]'), function (d) { return d.id; });
        var frag = document.createDocumentFragment();
        tpl.childNodes.forEach(function (c) { draw(c, vals, frag); });
        root.replaceChildren(frag);
        openIds.forEach(function (id) { var d = document.getElementById(id); if (d) d.open = true; });
        if (actId) { var again = document.getElementById(actId); if (again) { again.focus(); try { if (selS !== null) again.setSelectionRange(selS, selE); } catch (e) {} } }
        if (tab !== lastTab) { lastTab = tab; try { history.replaceState(null, '', '#' + tab); } catch (e) {} window.scrollTo(0, 0); }
      } else {
        var clock = root.querySelector('[data-clock]');
        if (clock) clock.textContent = vals.clock;
      }
    }
  };
  window.__app.update();
  comp.componentDidMount();
})();
