<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px">
<article style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 28px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap"><h3 style="margin: 0; font-size: 21px">기본 분석</h3><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #7A5A12">채팅으로 종목 질문</span></div>
<p style="margin: 8px 0 18px; color: #4B5563; font-size: 15px">숫자는 코드가 계산하고, AI는 그 숫자로 해설만 씁니다. AI가 가격이나 수량을 지어내지 않게 하기 위해서입니다.</p>
<h4 style="margin: 0 0 8px; font-size: 14px; color: #0F6E5A">모으는 자료</h4>

</ul>
<h4 style="margin: 0 0 8px; font-size: 14px; color: #0F6E5A">받는 결과</h4>
<ol style="margin: 0; padding-left: 20px; font-size: 15px; color: #374151; display: grid; gap: 4px">
<li>가격 기준 시각과 차트 이미지</li>
<li>결론: 신규 진입 · 보유 · 관망 · 매도 중 하나</li>
<li>재무 평가, 차트·투심 해설, 손절·목표가</li>
<li>성향에 맞춘 적정 수량</li>
<li>없는 자료는 '자료 공백'으로 밝히고 확신도를 낮춤</li>
<li>판단에 가장 영향을 준 지표 2개 쉬운 설명</li>
</ol>
</article>

<article style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 28px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap"><h3 style="margin: 0; font-size: 21px">심층 조사</h3><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #7A5A12">/research 종목 질문</span></div>
<p style="margin: 8px 0 18px; color: #4B5563; font-size: 15px">AI가 웹을 직접 검색해 기사·공시·실적 자료를 읽고, 근거마다 출처 링크를 붙여 정리합니다.</p>
<dl style="margin: 0 0 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: #E5E9EE; border: 1px solid #E5E9EE; border-radius: 6px; overflow: hidden; font-size: 14px">
<div style="background: #FFFFFF; padding: 12px 16px"><dt style="color: #6B7280">검색</dt><dd style="margin: 0; font-weight: 600">한 번에 최대 6회</dd></div>
<div style="background: #FFFFFF; padding: 12px 16px"><dt style="color: #6B7280">출처</dt><dd style="margin: 0; font-weight: 600">근거마다 링크</dd></div>
<div style="background: #FFFFFF; padding: 12px 16px"><dt style="color: #6B7280">이용 한도</dt><dd style="margin: 0; font-weight: 600">1인 하루 3회</dd></div>
<div style="background: #FFFFFF; padding: 12px 16px"><dt style="color: #6B7280">이럴 때</dt><dd style="margin: 0; font-weight: 600">급등락 이유, 실적 반응</dd></div>
</dl>
<p style="margin: 0; font-size: 15px; color: #374151">예: <code style="font-family: 'IBM Plex Mono', monospace; background: #F1F3F6; padding: 2px 6px; border-radius: 4px">/research 삼성전자 이번 실적 반응</code></p>
<p style="margin: 12px 0 0; font-size: 15px; color: #374151">찾지 못한 내용은 지어내지 않고 '확인 못 함'으로 남깁니다. 웹 검색 비용이 커서 하루 횟수를 제한합니다.</p>
</article>
</div>

<h3 style="margin: 56px 0 16px; font-family: 'Noto Serif KR', serif; font-size: clamp(22px, 2.6vw, 28px)">성능: 숫자로 확인한 것과 아직 모르는 것</h3>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px">

<div style="margin-top: 6px; font-weight: 700">차트 신호만으로는 수익 예측 못 함</div>
<p style="margin: 8px 0 0; font-size: 15px; color: #374151">843종목 3년, 10만여 건 거래로 시험한 결과 신호가 난 날이 아무 날이나 산 것보다 낫지 않았습니다. 그래서 '강력 매수' 같은 표현을 없애고 차트 상태 표시로만 씁니다.</p>
</div>
<div style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 24px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #7A5A12; letter-spacing: 0.08em">추적 중 · 표본 모으는 중</div>
<div style="margin-top: 6px; font-weight: 700">AI 최종 판정의 실제 성적</div>
<p style="margin: 8px 0 0; font-size: 15px; color: #374151">모든 분석의 판정을 기록하고 20거래일 뒤 지수와 비교합니다. 신규 진입·관망 각 30건, 전체 100건이 쌓이면 '우위 있음/차이 없음'을 판정해 /performance 에 공개합니다.</p>
</div>
<div style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 24px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #0F6E5A; letter-spacing: 0.08em">확인됨 · 잘하는 일</div>

<p style="margin: 8px 0 0; font-size: 15px; color: #374151">손절·목표가, 적정 수량, 실적 발표 임박 경고, 자료 공백 표시처럼 '실수를 줄이는' 쪽이 분석의 강점입니다. AI 비용은 분석 한 건에 몇십 원 수준입니다.</p>

<div style="margin-top: 28px; background: #0B1F3A; color: #FFFFFF; border-radius: 8px; padding: 26px 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px">

</div>
<p style="margin: 0; font-size: 15px; color: #C8D2E1">없어지지 않았습니다. 이동평균·VWAP으로 계산하는 차트 상태와, 변동성으로 손절·목표 폭을 조절하는 리스크 엔진은 지금도 모든 분석에 들어갑니다. 다만 검증 결과 차트 신호가 '살 때'를 맞히지는 못해서, 매수 추천이 아니라 차트 상태와 손절·목표가를 정하는 용도로만 씁니다.</p>

<svg width="36" height="66" viewBox="0 0 12 22" shape-rendering="crispEdges" aria-hidden="true">
<rect x="3" y="0" width="6" height="3" fill="#3A2A1E"></rect>
<rect x="3" y="3" width="6" height="4" fill="#F0C29A"></rect>
<rect x="7" y="4" width="1" height="1" fill="#1E1E24"></rect>
<rect x="2" y="7" width="8" height="7" fill="#C9A55A"></rect>
<rect x="8" y="6" width="4" height="5" fill="#FFFFFF"></rect>
<rect x="8" y="7" width="4" height="1" fill="#C8CFD9"></rect>
<rect class="px-legA" x="3" y="14" width="2" height="7" fill="#2B2F38"></rect>
<rect class="px-legA" x="7" y="14" width="2" height="5" fill="#2B2F38"></rect>
<rect class="px-legB" x="3" y="14" width="2" height="5" fill="#2B2F38"></rect>
<rect class="px-legB" x="7" y="14" width="2" height="7" fill="#2B2F38"></rect>
</svg>
</div>
</sc-if>
</div>
<div style="position: absolute; inset: 12px 14px; background: repeating-linear-gradient(90deg, transparent 0 134px, #3A3F4A 134px 140px); pointer-events: none"></div>
</div>
</div>
</sc-for>
<div style="margin-left: 190px; width: 840px; height: 40px; background: #2E333D; display: flex; justify-content: center; align-items: flex-end">
<div style="width: 120px; height: 34px; background: {{lobby}}; border: 4px solid #22262E; border-bottom: 0"></div>
</div>
</div>
<div style="height: 26px; background: #22262E; border-top: 4px solid #3A3F4A; position: relative"></div>
</div>
</div>
<p style="margin: -16px 0 24px; font-size: 13px; color: #6B7280">층 이름을 누르면 그 부서 직원만 아래에 보입니다. 불 켜진 층에서 말풍선이 뜬 직원이 지금 일하는 중입니다.</p>

<div role="group" aria-label="부서 고르기" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px">
<sc-for list="{{depts}}" as="dp" hint-placeholder-count="6">
<button type="button" onClick="{{dp.pick}}" aria-pressed="{{dp.pressed}}" style="{{dp.style}}">{{dp.label}}</button>
</sc-for>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<div style="flex: 999 1 640px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px">
<sc-for list="{{agents}}" as="ag" hint-placeholder-count="6">
<article style="{{ag.cardStyle}}">
<div style="display: flex; align-items: center; gap: 12px">
<div style="{{ag.avatarStyle}}">{{ag.initials}}</div>
<div style="flex: 1; min-width: 0">
<div style="font-weight: 700; font-size: 16px">{{ag.name}}</div>
<div style="font-size: 13px; color: #4B5563">{{ag.dept}} · {{ag.role}}</div>
</div>
<span style="{{ag.pillStyle}}"><span class="{{ag.dotClass}}" style="{{ag.dotStyle}}"></span>{{ag.statusLabel}}</span>
</div>
<sc-if value="{{ag.isWorking}}" hint-placeholder-val="{{false}}">
<div style="margin-top: 16px; background: #F1F7F5; border-radius: 6px; padding: 12px 14px">
<div style="font-size: 12px; color: #0A4F40; font-weight: 600">{{ag.jobName}}</div>
<div class="tq-task" style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; margin-top: 4px; color: #0B1F3A">{{ag.task}}<span class="tq-caret"></span></div>
<div style="height: 6px; background: #D4E6E0; border-radius: 3px; margin-top: 10px; overflow: hidden"><div class="tq-bar" style="{{ag.barStyle}}"></div></div>
</div>
</sc-if>
<sc-if value="{{ag.isIdle}}" hint-placeholder-val="{{true}}">
<div style="margin-top: 16px; font-size: 14px; color: #374151; display: grid; gap: 4px">
<div><span style="color: #6B7280">다음</span> {{ag.next}}</div>
<div><span style="color: #6B7280">최근</span> {{ag.last}}</div>
</div>
</sc-if>
<sc-if value="{{ag.isAlways}}" hint-placeholder-val="{{false}}">
<div style="margin-top: 16px; font-size: 14px; color: #374151">{{ag.task}}</div>
</sc-if>
</article>
</sc-for>
</div>
<aside aria-label="근무 일지" style="flex: 1 1 280px; min-width: 0; background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 20px">
<h3 style="margin: 0 0 4px; font-size: 16px">근무 일지</h3>
<p style="margin: 0 0 14px; font-size: 13px; color: #6B7280">최근에 끝낸 작업</p>
<ol style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{feed}}" as="fe" hint-placeholder-count="8">
<li style="display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid #EEF1F4; font-size: 14px">
<span style="font-family: 'IBM Plex Mono', monospace; color: #0F6E5A">{{fe.time}}</span>
<span><b>{{fe.who}}</b><br><span style="color: #4B5563">{{fe.what}}</span></span>
</li>
</sc-for>
</ol>
</aside>
</div>
<p style="margin: 24px 0 0; font-size: 13px; color: #6B7280">이 화면은 서버의 실제 예약 작업 일정표를 그대로 옮겨 시간에 맞춰 재현한 것입니다. 서버와 직접 연결된 실시간 상태는 아니며, 실제 상태는 봇의 /status 에서 확인합니다.</p>
</div>
</section>
</sc-if>

<sc-if value="{{isStrategy}}" hint-placeholder-val="{{false}}">
<section style="padding: 56px 24px 80px">
<div style="max-width: 1200px; margin: 0 auto">
<p style="margin: 0 0 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.12em; color: #0F6E5A">INVESTMENT POLICY</p>
<h2 style="margin: 0 0 12px; font-family: 'Noto Serif KR', serif; font-size: clamp(26px, 3.4vw, 36px); line-height: 1.3">돈을 세 갈래로 나눠 굴립니다</h2>
<p style="margin: 0 0 32px; font-size: 17px; color: #4B5563; max-width: 720px">비중은 검증 결과를 보고 대표가 결재해 정합니다. 지금 기준입니다.</p>
<div role="img" aria-label="배분: 장기 성장 60%, 나스닥 20%, 코스피 10%, 대표 단타 10%" style="display: flex; height: 52px; border-radius: 6px; overflow: hidden; font-weight: 700; font-size: 14px">
<div style="flex: 60; background: #0B1F3A; color: #FFFFFF; display: flex; align-items: center; padding: 0 16px">장기 성장 60%</div>
<div style="flex: 20; background: #0F6E5A; color: #FFFFFF; display: flex; align-items: center; padding: 0 12px">나스닥 20</div>
<div style="flex: 10; background: #7FB8A8; color: #0B1F3A; display: flex; align-items: center; padding: 0 10px">코스피 10</div>
<div style="flex: 10; background: #E3CB92; color: #0B1F3A; display: flex; align-items: center; padding: 0 10px">단타 10</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1px; background: #D9DEE5; border: 1px solid #D9DEE5; border-radius: 8px; overflow: hidden; margin-top: 24px">
<div style="background: #FFFFFF; padding: 26px"><h3 style="margin: 0 0 8px; font-size: 18px">장기 성장 60%</h3><p style="margin: 0; color: #374151; font-size: 15px">재무가 튼튼한 관심종목 10~15개를 고점 대비 -10%·-20%·-30% 세 구간에 나눠 삽니다. 한 종목은 이 몫의 10%를 넘지 않고, 추세가 꺾이거나 뉴스·실적이 나쁘면 관망합니다.</p></div>
<div style="background: #FFFFFF; padding: 26px"><h3 style="margin: 0 0 8px; font-size: 18px">지수 엔진 30%</h3><p style="margin: 0; color: #374151; font-size: 15px">나스닥 20%는 200일 이동평균선 위에서만 보유하고 아래로 내려가면 현금으로 비킵니다. 코스피 10%는 그대로 보유합니다.</p></div>
<div style="background: #FFFFFF; padding: 26px"><h3 style="margin: 0 0 8px; font-size: 18px">대표 단타 10%</h3><p style="margin: 0; color: #374151; font-size: 15px">비용을 넘는 단타 규칙은 검증에서 찾지 못했습니다. 그래서 회사 전략이 아니라 대표 개인 몫으로 두고, 기록만 남겨 성적을 봅니다.</p></div>
</div>

<h2 style="margin: 72px 0 12px; font-family: 'Noto Serif KR', serif; font-size: clamp(24px, 3vw, 32px); line-height: 1.3">투자위원회: 통과한 기법만 씁니다</h2>
<p style="margin: 0 0 28px; font-size: 17px; color: #4B5563; max-width: 720px">시험 조건은 결과를 보기 전에 고정하고, 시험한 횟수만큼 통과 기준을 높입니다. 매주 월요일 위원회에서 반론 담당이 따로 검토하고, 디자인·UX팀은 이용 통계와 사용자 의견으로 쓰기 편한 봇을 위한 개선안을 올립니다.</p>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px">
<li style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 6px; padding: 18px"><div style="font-family: 'IBM Plex Mono', monospace; color: #7A5A12">STEP 1</div><div style="font-weight: 600">가설 등록</div></li>
<li style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 6px; padding: 18px"><div style="font-family: 'IBM Plex Mono', monospace; color: #7A5A12">STEP 2</div><div style="font-weight: 600">목표 분류</div></li>
<li style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 6px; padding: 18px"><div style="font-family: 'IBM Plex Mono', monospace; color: #7A5A12">STEP 3</div><div style="font-weight: 600">같은 기준선과 시험</div></li>
<li style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 6px; padding: 18px"><div style="font-family: 'IBM Plex Mono', monospace; color: #7A5A12">STEP 4</div><div style="font-weight: 600">판정</div></li>
<li style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 6px; padding: 18px"><div style="font-family: 'IBM Plex Mono', monospace; color: #7A5A12">STEP 5</div><div style="font-weight: 600">종이 매매 6개월</div></li>
<li style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 6px; padding: 18px"><div style="font-family: 'IBM Plex Mono', monospace; color: #7A5A12">STEP 6</div><div style="font-weight: 600">승격 또는 폐기</div></li>
</ol>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-top: 28px">
<div style="background: #0B1F3A; color: #FFFFFF; border-radius: 8px; padding: 26px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #8FD3BF">확인됨</div><h3 style="margin: 6px 0 8px; font-size: 18px">대표·등기임원 장내 매수</h3><p style="margin: 0; color: #C8D2E1; font-size: 15px">2017~2026년 공시 5만 6천여 건에서 매수 뒤 60일 평균 +2.49%(t 5.9). 지금은 종이 펀드 C로 실제 성적을 쌓는 중입니다.</p></div>
<div style="background: #0B1F3A; color: #FFFFFF; border-radius: 8px; padding: 26px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #8FD3BF">쓰는 중</div><h3 style="margin: 6px 0 8px; font-size: 18px">지수 200일선 추세 추종</h3><p style="margin: 0; color: #C8D2E1; font-size: 15px">수익을 더 내는 기법이 아니라 큰 하락을 줄이는 장치입니다. 그래서 지수 엔진에만 씁니다.</p></div>
<div style="background: #0B1F3A; color: #FFFFFF; border-radius: 8px; padding: 26px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #E3CB92">접음</div><h3 style="margin: 6px 0 8px; font-size: 18px">12갈래는 다시 시험하지 않습니다</h3><p style="margin: 0; color: #C8D2E1; font-size: 15px">차트 매일 매매, 당일·3일 단타, 레버리지, 코스피 타이밍, 이상 현상 카탈로그 등은 기준선을 넘지 못했습니다. 새 자료와 결재가 있어야 다시 엽니다.</p></div>
</div>
</div>
</section>
</sc-if>

<sc-if value="{{isResearch}}" hint-placeholder-val="{{false}}">
<section style="padding: 56px 24px 80px">
<div style="max-width: 1200px; margin: 0 auto">
<p style="margin: 0 0 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.12em; color: #0F6E5A">RESEARCH LIBRARY</p>
<h2 style="margin: 0 0 12px; font-family: 'Noto Serif KR', serif; font-size: clamp(26px, 3.4vw, 36px); line-height: 1.3">리서치 자료실</h2>
<p style="margin: 0 0 36px; font-size: 17px; color: #4B5563; max-width: 760px">모든 리포트는 같은 형식을 따릅니다. 한눈에 보는 기본 정보, 그리고 사실 · 강점 · 약점 세 갈래 요약. 결론보다 근거와 한계를 먼저 적습니다.</p>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px">

<article style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column">
<div style="background: #0B1F3A; color: #FFFFFF; padding: 22px 24px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #C9A55A; letter-spacing: 0.12em">STRATEGY REPORT · 확인됨</div>
<div style="font-family: 'Noto Serif KR', serif; font-size: 23px; font-weight: 700; margin-top: 4px">대표·등기임원 장내 매수</div>
<div style="font-size: 14px; color: #AEBBD0; margin-top: 2px">내부자가 자기 돈으로 산 뒤 주가는 어땠나</div>
</div>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); font-size: 14px; border-bottom: 1px solid #E5E9EE">
<div style="padding: 12px 24px; border-right: 1px solid #E5E9EE"><dt style="color: #6B7280">전략 유형</dt><dd style="margin: 0; font-weight: 600">공시 이벤트</dd></div>
<div style="padding: 12px 24px"><dt style="color: #6B7280">시장</dt><dd style="margin: 0; font-weight: 600">국내</dd></div>
<div style="padding: 12px 24px; border-right: 1px solid #E5E9EE; border-top: 1px solid #E5E9EE"><dt style="color: #6B7280">검증 기간</dt><dd style="margin: 0; font-weight: 600; font-family: 'IBM Plex Mono', monospace">2017-03 ~ 2026-10</dd></div>
<div style="padding: 12px 24px; border-top: 1px solid #E5E9EE"><dt style="color: #6B7280">표본</dt><dd style="margin: 0; font-weight: 600; font-family: 'IBM Plex Mono', monospace">56,489건</dd></div>
</dl>
<div style="padding: 18px 24px; font-size: 14px; color: #374151; display: grid; gap: 12px; flex: 1">
<div><b style="color: #0B1F3A">사실</b> 대표·등기임원 장내 매수 뒤 60거래일 평균 +2.49%(t 5.9). 장내 매도 뒤는 -1.78%(t -2.9).</div>
<div><b style="color: #0F6E5A">강점</b> 10년 가까운 공시 전체로 확인했고, 매수와 매도가 반대 방향으로 갈려 우연일 가능성이 낮음.</div>
<div><b style="color: #8A3B12">약점</b> 건당 효과가 작아 비용·세금 뒤 몫이 줄어듦. 실제 돈으로는 아직 검증 전이라 종이 펀드 C로 기록 중.</div>
</div>
<div style="padding: 14px 24px; border-top: 1px solid #E5E9EE; font-size: 13px; color: #6B7280">봇에서 /insider · /paperc</div>
</article>

<article style="background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column">
<div style="background: #0B1F3A; color: #FFFFFF; padding: 22px 24px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #C9A55A; letter-spacing: 0.12em">STRATEGY REPORT · 사용 중</div>
<div style="font-family: 'Noto Serif KR', serif; font-size: 23px; font-weight: 700; margin-top: 4px">코스피 200일선 추세 추종</div>
<div style="font-size: 14px; color: #AEBBD0; margin-top: 2px">지수가 200일 평균 아래면 현금으로 비키기</div>
</div>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); font-size: 14px; border-bottom: 1px solid #E5E9EE">
<div style="padding: 12px 24px; border-right: 1px solid #E5E9EE"><dt style="color: #6B7280">전략 유형</dt><dd style="margin: 0; font-weight: 600">국면 · 하락 방어</dd></div>
<div style="padding: 12px 24px"><dt style="color: #6B7280">시장</dt><dd style="margin: 0; font-weight: 600">국내 지수</dd></div>
<div style="padding: 12px 24px; border-right: 1px solid #E5E9EE; border-top: 1px solid #E5E9EE"><dt style="color: #6B7280">검증 기간</dt><dd style="margin: 0; font-weight: 600; font-family: 'IBM Plex Mono', monospace">2016-10 ~ 2026-10</dd></div>
<div style="padding: 12px 24px; border-top: 1px solid #E5E9EE"><dt style="color: #6B7280">비교 대상</dt><dd style="margin: 0; font-weight: 600">코스피 그냥 보유</dd></div>
</dl>
<div style="padding: 18px 24px; font-size: 14px; color: #374151; display: grid; gap: 12px; flex: 1">
<div><b style="color: #0B1F3A">사실</b> 연 수익 +12.5%로 그냥 보유(+12.0%)와 비슷하고, 최대 낙폭은 -35%에서 -25%로 줄었음.</div>
<div><b style="color: #0F6E5A">강점</b> 지수 자체로 시험해 종목 선정 편향이 없음. 수익을 버리지 않고 큰 하락만 줄임.</div>
<div><b style="color: #8A3B12">약점</b> 월말 판단이라 급락·급반등에는 늦음. 같은 규칙이 미국 S&amp;P 500에서는 이 기간 수익을 깎았음.</div>
</div>
<div style="padding: 14px 24px; border-top: 1px solid #E5E9EE; font-size: 13px; color: #6B7280">봇에서 /strategy · /market</div>
</article>

<article style="background: #FFFFFF; border: 1px dashed #B7C0CC; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; padding: 28px 24px">
<div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #7A5A12; letter-spacing: 0.12em">준비 중</div>
<h3 style="margin: 6px 0 14px; font-family: 'Noto Serif KR', serif; font-size: 21px">같은 형식으로 늘려 갈 리포트</h3>
<ul style="margin: 0; padding-left: 18px; color: #374151; font-size: 15px; display: grid; gap: 8px">
<li><b>종목 리포트</b> — 관심종목별 기본 정보, 실적, 강점·약점</li>
<li><b>디지털 자산 리포트</b> — 비트코인·이더리움·솔라나 등</li>
<li><b>월간 운용 보고서</b> — 세 갈래 운용 성적과 결재 사항</li>
<li><b>종이 펀드 A·B·C 기록</b> — 실제 돈 없이 규칙대로 사고판 성적</li>
</ul>
</article>
</div>
</div>
</section>

      ['5F', '자산운용본부', ['kr', 'us']],
      ['4F', '리서치센터', ['news', 'macro', 'release', 'disclose']],
      ['3F', '리스크 · 준법감시', ['risk', 'compliance']],
      ['2F', '트레이딩 · 데이터', ['paper', 'data']],
      ['1F', 'IT·보안실', ['it']]
    ];
    const looks = { uxr: ['#3A2A1E', '#B5527A'], uxd: ['#1E1E24', '#2E8B8B'], ceo: ['#1E1E24', '#1B2A44', '#C9A55A'], lab: ['#2B1D14', '#6B4FA0'], perf: ['#1E1E24', '#0F6E5A'], kr: ['#2B1D14', '#1E3A5F'], us: ['#7A4A28', '#24508A'],
      news: ['#1E1E24', '#0E5E6F'], macro: ['#3A2A1E', '#2F7A8A'], release: ['#7A3B2A', '#3D6E9E'], disclose: ['#1E1E24', '#5E8A3A'],
      risk: ['#2B1D14', '#9A7420'], compliance: ['#55555E', '#8A3B12'], paper: ['#7A4A28', '#5B3A6B'], data: ['#1E1E24', '#5A6575'], it: ['#2B1D14', '#3A4A5A'] };
    const byId = {};
    spec.forEach((a) => { byId[a.id] = a; });
    let busy = 0;
    const floors = floorDefs.map((fd) => {
      const people = fd[2].map((id) => {
        const a = byId[id];
        const s = a.always ? null : sched[id];
        const lk = looks[id];
        const active = !!(a.always || (s && s.active));
        let task = '', tag = '';
        if (a.always) task = '비용·접근 상시 감시';
        else if (s.active) { const j = s.active.job; task = j.tasks[Math.floor(nowMs / 3500) % j.tasks.length]; }
        else if (s.next) {
          const nowMin = Math.floor(nowMs / 60000);
          const f = this.fields(s.next.at * 60000 + 9 * 3600000);
          tag = '다음 ' + (s.next.at - nowMin < 18 * 60 ? '' : (f.mo + 1) + '/' + f.day + ' ') + this.hm(s.next.at);
        } else tag = '대기';
        if (active && !a.always) busy++;
        return { label: a.name + ' ' + a.role + (active ? ' 작업 중' : ' 대기'), hair: lk[0], shirt: lk[1], tie: lk[2] || lk[1],
          isWorking: active, isIdle: !active, task: task, tag: tag,
          bodyClass: active ? 'px-type' : '', screenClass: active ? 'px-screen' : '',
          screen: active ? '#8FE3FF' : '#1C2230', screenLine: active ? '#2A6F8F' : '#262D3C' };
      });
      const working = people.some((p) => p.isWorking);
      const lit = working || !night;
      const focus = this.state.focus;
      const on = !!focus && focus.join() === fd[2].join();
      return { no: fd[0], name: fd[1], people: people, isServer: fd[0] === '1F', walker: working,
        walkerStyle: 'animation-delay: -' + (((nowMs / 1000) + fd[2].length * 4) % 16).toFixed(2) + 's',
        pressed: on ? 'true' : 'false', pick: () => this.setState({ focus: on ? null : fd[2], dept: '전체' }),
        labelStyle: 'width: 180px; margin-right: 10px; flex: none; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; text-align: right; gap: 2px; padding: 0 14px; border: 0; border-right: 4px solid ' + (working ? '#C9A55A' : '#3A3F4A') + '; background: ' + (on ? '#2B4A75' : 'rgba(11,31,58,.86)') + '; color: #FFFFFF; font: inherit; cursor: pointer; margin-bottom: 6px',
        roomStyle: 'position: relative; height: 102px; overflow: hidden; display: flex; align-items: flex-end; gap: 22px; padding: 0 16px 0 22px; background: ' + (working ? '#E8B866' : (lit ? '#B39B74' : '#1E2430')) + '; transition: background .6s',
        lampStyle: 'position: absolute; top: 0; left: 0; right: 0; height: 8px; background: repeating-linear-gradient(90deg, transparent 0 60px, ' + (working ? '#FFF1C9' : (lit ? '#D6C49F' : '#2A3140')) + ' 60px 76px, transparent 76px 140px)' };
    });
    const win = night ? '#E9B866' : '#7F9DB5';
    const sk = (side, pos, w, h) => 'position: absolute; bottom: 26px; ' + side + ': ' + pos + 'px; width: ' + w + 'px; height: ' + h + 'px; background-color: #262C3A; background-image: repeating-linear-gradient(0deg, #262C3A 0 9px, transparent 9px 19px), repeating-linear-gradient(90deg, ' + win + ' 0 8px, #262C3A 8px 18px)';
    const stars = [];
    if (night) {
      const pts = [[4, 22], [11, 60], [17, 34], [26, 14], [33, 48], [41, 26], [52, 12], [58, 40], [66, 20], [73, 54], [79, 30], [88, 16], [94, 44], [98, 70]];
      pts.forEach((p, i) => stars.push({ style: 'position: absolute; left: ' + p[0] + '%; top: ' + p[1] + 'px; width: 3px; height: 3px; background: #E8ECF7; opacity: ' + (i % 3 === 0 ? 1 : 0.6) }));
    }
    return {
      floors: floors, stars: stars,
      sceneLabel: '사옥 단면 그림: 지금 작업 중인 직원 ' + busy + '명',
      skyStyle: 'position: relative; overflow: hidden; min-width: 1040px; background: ' + (night ? 'linear-gradient(#10162B 0 35%, #18213D 35% 65%, #222C4E 65%)' : 'linear-gradient(#8DBBE0 0 35%, #A3C9E7 35% 65%, #BAD6EC 65%)'),
      moonColor: night ? '#F4E7B5' : '#FFE08A',
      skyline1: sk('left', 0, 120, 430), skyline2: sk('left', 110, 90, 300),
      skyline3: sk('right', 0, 130, 470), skyline4: sk('right', 120, 80, 320),
      lobby: night ? '#E8B866' : '#9FB7C9'
    };
  }
  renderVals() {
    const tab = this.state.tab || this.props.startTab || 'overview';
    const nowMs = this.state.now;
    const nowMin = Math.floor(nowMs / 60000);
    if (nowMin !== this._cacheMin) { this._sched = this.compute(nowMin); this._cacheMin = nowMin; }
    const sched = this._sched;
    const kst = this.fields(nowMs + 9 * 3600000);
    const pad = (n) => String(n).padStart(2, '0');
    const tabDefs = [['overview', '개요'], ['analysis', '종목 분석'], ['work', '일하는 모습'], ['strategy', '운용 원칙 · 검증'], ['research', '리서치 자료실'], ['safety', '안전장치']];
    const tabs = tabDefs.map((t) => {
      const on = t[0] === tab;
      return { label: t[1], pressed: on ? 'true' : 'false', pick: () => this.setState({ tab: t[0] }),
        style: 'min-height: 48px; padding: 0 18px; border: 0; border-bottom: 3px solid ' + (on ? '#C9A55A' : 'transparent') + '; background: transparent; color: ' + (on ? '#FFFFFF' : '#AEBBD0') + '; font: inherit; font-size: 15px; font-weight: ' + (on ? '700' : '500') + '; cursor: pointer; white-space: nowrap' };
    });
    const spec = this.spec();
    const deptNames = ['전체'].concat(spec.map((a) => a.dept).filter((d, i, arr) => arr.indexOf(d) === i));
    const depts = deptNames.map((d) => {
      const on = !this.state.focus && d === this.state.dept;
      return { label: d, pressed: on ? 'true' : 'false', pick: () => this.setState({ dept: d, focus: null }),
        style: 'min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid ' + (on ? '#0B1F3A' : '#C8CFD9') + '; background: ' + (on ? '#0B1F3A' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#0B1F3A') + '; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer' };
    });
    let working = 0, always = 0, soonest = null;
    const agents = spec.map((a) => {
      const base = { name: a.name, initials: a.initials, dept: a.dept, role: a.role,
        avatarStyle: 'width: 44px; height: 44px; border-radius: 50%; background: ' + a.color + '; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; flex: none' };
      if (a.always) {
        always++;
        return Object.assign(base, { isWorking: false, isIdle: false, isAlways: true, task: a.alwaysText, statusLabel: '상시',
          pillStyle: 'display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #F6EEDC; color: #6B4E0E',
          dotClass: '', dotStyle: 'width: 8px; height: 8px; border-radius: 50%; background: #B8892E',
          cardStyle: 'background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 18px', show: this.showAgent(a) });
      }
      const s = sched[a.id];
      if (s.next && (!soonest || s.next.at < soonest.at)) soonest = { at: s.next.at, who: a.name, job: s.next.job.name };
      if (s.active) {
        working++;
        const j = s.active.job;
        const elapsed = (nowMs / 60000) - s.active.start;
        const pct = Math.max(4, Math.min(100, (elapsed / j.dur) * 100));
        const ti = Math.floor(nowMs / 3500) % j.tasks.length;
        return Object.assign(base, { isWorking: true, isIdle: false, isAlways: false, jobName: j.name, task: j.tasks[ti],
          statusLabel: '작업 중', barStyle: 'height: 100%; width: ' + pct.toFixed(1) + '%; background: #0F6E5A; border-radius: 3px; transition: width 1s linear',
          pillStyle: 'display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #DDF0EA; color: #0A4F40',
          dotClass: 'tq-live', dotStyle: 'width: 8px; height: 8px; border-radius: 50%; background: #0F6E5A',
          cardStyle: 'background: #FFFFFF; border: 1px solid #0F6E5A; border-radius: 8px; padding: 18px; box-shadow: 0 2px 10px rgba(11,31,58,.08)', show: this.showAgent(a) });
      }
      return Object.assign(base, { isWorking: false, isIdle: true, isAlways: false,
        next: s.next ? this.rel(s.next.at - nowMin, s.next.at) + ' · ' + s.next.job.name : '예정 없음',
        last: s.last ? this.hm(s.last.at) + ' · ' + s.last.job.done : '기록 없음',
        statusLabel: '대기', pillStyle: 'display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #EEF1F4; color: #4B5563',
        dotClass: '', dotStyle: 'width: 8px; height: 8px; border-radius: 50%; background: #9AA4B2',
        cardStyle: 'background: #FFFFFF; border: 1px solid #D9DEE5; border-radius: 8px; padding: 18px', show: this.showAgent(a) });
    });
    const feed = [];
    spec.forEach((a) => {
      if (a.always) return;
      const s = sched[a.id];
      if (s.last) feed.push({ at: s.last.at, time: this.hm(s.last.at), who: a.name + ' · ' + a.role, what: s.last.job.done });
    });
    feed.sort((x, y) => y.at - x.at);
    const sc = this.scene(spec, sched, nowMs, kst);
    return {
      floors: sc.floors, stars: sc.stars, sceneLabel: sc.sceneLabel, skyStyle: sc.skyStyle, moonColor: sc.moonColor,
      skyline1: sc.skyline1, skyline2: sc.skyline2, skyline3: sc.skyline3, skyline4: sc.skyline4, lobby: sc.lobby,
      tabs: tabs,
      isOverview: tab === 'overview', isAnalysis: tab === 'analysis', isWork: tab === 'work', isStrategy: tab === 'strategy', isResearch: tab === 'research', isSafety: tab === 'safety',
      goWork: () => this.setState({ tab: 'work' }),
      clock: pad(kst.h) + ':' + pad(kst.m) + ':' + pad(kst.s),
      dateLabel: kst.y + '년 ' + (kst.mo + 1) + '월 ' + kst.day + '일 ' + '일월화수목금토'[kst.dow] + '요일',
      depts: depts,
      agents: agents.filter((a) => a.show),
      agentCount: spec.length,
      workingCount: working,
      alwaysCount: always,
      nextUp: soonest ? this.rel(soonest.at - nowMin, soonest.at) + ' · ' + soonest.who + ' — ' + soonest.job : '-',
      feed: feed.slice(0, 9)
    };
  }
}

(function () {
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var ONE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  function get(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope[parts[0]];
    for (var i = 1; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(str, scope) {
    var m = str.match(ONE);
    if (m) return get(scope, m[1]);
    return str.replace(HOLE, function (_, p) { var v = get(scope, p); return v == null ? '' : String(v); });
  }
  function draw(node, scope, out) {
    if (node.nodeType === 3) { var t = interp(node.nodeValue, scope); out.appendChild(document.createTextNode(t == null ? '' : String(t))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-for') {
      var list = interp(node.getAttribute('list'), scope) || [], as = node.getAttribute('as');
      list.forEach(function (item, i) {
        var s = Object.create(scope); s[as] = item; s.$index = i;
        node.childNodes.forEach(function (c) { draw(c, s, out); });
      });
      return;
    }
    if (tag === 'sc-if') { if (interp(node.getAttribute('value'), scope)) node.childNodes.forEach(function (c) { draw(c, scope, out); }); return; }
    var el = document.createElementNS(node.namespaceURI, tag);
    for (var k = 0; k < node.attributes.length; k++) {
      var a = node.attributes[k];
      if (a.name.indexOf('hint-') === 0) continue;
      var v = interp(a.value, scope);
      if (a.name.indexOf('on') === 0 && typeof v === 'function') { el.addEventListener(a.name.slice(2), v); continue; }
      if (v === undefined || v === null || v === false) continue;
      el.setAttribute(a.name, v);
    }
    node.childNodes.forEach(function (c) { draw(c, scope, el); });
    out.appendChild(el);
  }
  var root = document.getElementById('app');
  var tpl = document.getElementById('tpl').content;
  var comp = new Component({});
  var hash = (location.hash || '').replace('#', '');
  if (['overview', 'analysis', 'work', 'strategy', 'research', 'safety'].indexOf(hash) >= 0) comp.state.tab = hash;
  var last = null, lastTab = comp.state.tab;
  window.__app = {
    update: function () {
      var vals = comp.renderVals();
      var tab = comp.state.tab || 'overview';
      var now = comp.state.now;
      var sig = JSON.stringify([tab, comp.state.dept, comp.state.focus, Math.floor(now / 60000), tab === 'work' ? Math.floor(now / 3500) : 0]);
      if (sig !== last) {
        last = sig;
        var frag = document.createDocumentFragment();
        tpl.childNodes.forEach(function (c) { draw(c, vals, frag); });
        root.replaceChildren(frag);
        if (tab !== lastTab) { lastTab = tab; history.replaceState(null, '', '#' + tab); window.scrollTo(0, 0); }
      } else {
        var clock = root.querySelector('[data-clock]');
        if (clock) clock.textContent = vals.clock;
      }
    }
  };
  window.__app.update();
  comp.componentDidMount();
})();
</script>
